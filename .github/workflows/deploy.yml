name: Deploy na GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Publikujemy przez zwykły push plików na gałąź gh-pages, a nie przez
# środowisko github-pages — dzięki temu deploy nie zależy od reguł ochrony
# środowiska ani od trybu "GitHub Actions" w ustawieniach Pages.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Build statyczny
        env:
          # Pages serwuje projekt pod /<nazwa-repo>. Po podpięciu własnej
          # domeny wyzeruj BASE_PATH ("") i wpisz właściwy SITE_URL.
          NEXT_PUBLIC_BASE_PATH: /TomaszSwords
          NEXT_PUBLIC_SITE_URL: https://thekosiner.github.io/TomaszSwords
        run: npm run build

      - name: Publikacja katalogu out/ na gałęzi gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f out/index.html || { echo "Brak out/index.html — build nic nie wygenerował"; exit 1; }
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Wypchnięto $(find . -name '*.html' | wc -l) stron HTML na gh-pages"
